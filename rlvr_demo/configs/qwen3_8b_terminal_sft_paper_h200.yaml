experiment_name: qwen3-8b-terminal-sft-paper-mix-h200
trial_name: trial0

seed: 7
enable_offload: false
total_train_epochs: 2
total_train_steps: null
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-qwen3-8b
  name_resolve:
    type: nfs
    nfs_record_root: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-qwen3-8b/name_resolve

scheduler:
  type: local

actor:
  # Paper recipe uses Qwen3-8B, global batch 128, micro-batch 1/GPU,
  # max sequence length 32768. On this single H200 node we use TP=8.
  backend: "megatron:d1p1t8"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-8B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  pad_to_maximum: true
  enable_tree_training: true
  optimizer:
    type: adam
    lr: 2e-5
    weight_decay: 1e-4
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.10
  megatron:
    bridge_type: mbridge
    ddp:
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_distributed_optimizer: true
    use_deterministic_algorithms: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 16
      mem: 128
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PATH: /wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-megatron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        NCCL_SOCKET_IFNAME: enp71s0
        GLOO_SOCKET_IFNAME: enp71s0
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"
        CUDA_DEVICE_MAX_CONNECTIONS: "1"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        HF_HOME: /wbl-fast/usrs/ee/teacher-answer-rl/hf_cache
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TRITON_CACHE_DIR: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRITON_CACHE_PATH: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRANSFORMERS_NO_TF: "1"
        USE_TF: "0"
        USE_FLAX: "0"
        TF_CPP_MIN_LOG_LEVEL: "3"

train_dataset:
  batch_size: 128
  shuffle: false
  pin_memory: true
  num_workers: 8
  path: nvidia/Nemotron-Terminal-Corpus
  split: train
  type: sft
  max_length: 32768
  scheduling_spec: null
  dataset_kwargs:
    name: full_mix
    split_part: train
    holdout_size: 512
    shuffle_records: false
    shuffle_source_groups: true
    strip_prior_assistant_thinking: true
    enable_thinking: true
    lazy_tokenize: true

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 500
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
