experiment_name: ta-mixed-easy50-mediumodd50-cmdpresence-rlonly-from-sft-local-s1000-r1
trial_name: trial0

seed: 7
enable_offload: false
total_train_epochs: 1
total_train_steps: 1000
tokenizer_path: ${actor.path}

# Four-hour mixed-data hand-crafted TA-RL recipe.
# The reward is the terminal-specific turn/action similarity reward used by the
# strongest easy/medium TA-RL recipes. The data is a deterministic 50/50 mix of
# easy converted teacher turns and sampled medium-odd converted teacher turns.

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo
  name_resolve:
    type: nfs
    nfs_record_root: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  check_trajectory_format: true
  setup_timeout: 1200

gconfig:
  n_samples: 2
  min_new_tokens: 0
  max_new_tokens: 1024
  max_tokens: 32768
  greedy: false
  temperature: 0.6
  top_p: 0.95
  top_k: 20

eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 1024
  max_tokens: 32768
  greedy: false
  temperature: 0.6
  top_p: 0.95
  top_k: 20

actor:
  backend: "megatron:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/checkpoints/ewer/qwen3-4b-thinking-terminus-tool-sft-medium-even-trajectory32768-b32-tok576k-h200/trial0/default/epoch0epochstep1384globalstep1384
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  pad_to_maximum: true
  enable_tree_training: true
  optimizer:
    type: adam
    lr: 7e-8
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k3
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  rejection_sampling: null
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  megatron:
    bridge_type: mbridge
    ddp:
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_distributed_optimizer: true
    use_deterministic_algorithms: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 16
      mem: 128
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PATH: /wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-megatron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        NCCL_SOCKET_IFNAME: enp71s0
        GLOO_SOCKET_IFNAME: enp71s0
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"
        CUDA_DEVICE_MAX_CONNECTIONS: "1"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        HF_HOME: /wbl-fast/usrs/ee/teacher-answer-rl/hf_cache
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TRITON_CACHE_DIR: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRITON_CACHE_PATH: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRANSFORMERS_NO_TF: "1"
        USE_TF: "0"
        USE_FLAX: "0"
        TF_CPP_MIN_LOG_LEVEL: "3"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  python_executable: ${oc.env:AREAL_SGLANG_PYTHON,/wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-rollout-sglang/bin/python}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: 256
  context_length: 32768
  mem_fraction_static: 0.70
  attention_backend: flashinfer
  log_level: warning
  log_level_http: warning
  chunked_prefill_size: -1
  max_prefill_tokens: 32768

vllm:
  model: ${actor.path}
  python_executable: ${oc.env:AREAL_VLLM_PYTHON,/wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-rollout-vllm/bin/python}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_num_seqs: 64
  max_model_len: 32768
  gpu_memory_utilization: 0.70
  no_enable_prefix_caching: false
  uvicorn_log_level: warning

train_dataset:
  batch_size: 8
  shuffle: false
  pin_memory: true
  num_workers: 8
  path: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/data/skill_based_mixed_easy50_medium_odd50.terminus_tool.jsonl
  split: train
  type: rl
  max_length: 32768
  scheduling_spec: null
  dataset_kwargs:
    split_part: null
    holdout_size: 0
    shuffle_records: false
    shuffle_source_groups: true
    enable_thinking: true
    lazy_tokenize: true
    workflow_mode: full_turn
    teacher_answer_start: tool_call
    teacher_answer_scorer: ref
    teacher_answer_score_mode: commands
    teacher_answer_logp_reward_weight: 0.0
    teacher_loss_span: tool_call
    syntax_reward_on_teacher_row: true
    supervise_teacher_answer: false
    teacher_answer_supervised_weight: 0.0
    teacher_answer_supervised_score_mode: all
    teacher_answer_supervised_max_prefix_tokens: 128
    teacher_answer_reward_norm: group
    teacher_answer_reward_norm_group_size: ${gconfig.n_samples}
    teacher_command_match_reward_weight: 1.5
    teacher_command_presence_reward_weight: 0.4
    teacher_command_newline_reward_weight: 0.05
    teacher_completion_match_reward_weight: 2.0
    teacher_empty_completion_reward_weight: 0.5
    teacher_command_count_reward_weight: 0.2
    teacher_repeated_command_penalty_weight: 1.0
    teacher_reward_requires_valid_syntax: false
    drop_invalid_teacher_row_loss: false
    syntax_reward_weight: 1.0
    valid_syntax_reward: 0.5
    invalid_syntax_reward: -1.0
    syntax_thinking_length_penalty_weight: 0.0
    syntax_output_length_penalty_weight: 0.12
    emit_syntax_view: true
    emit_valid_syntax_view: false

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 100
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
