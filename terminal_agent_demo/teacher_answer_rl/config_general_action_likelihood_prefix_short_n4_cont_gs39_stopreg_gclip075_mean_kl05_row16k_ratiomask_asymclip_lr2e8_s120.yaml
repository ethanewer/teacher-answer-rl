# Long-run domain-general TA-RL continuation with generic stop regularization.
# Stage 1 is the validated short likelihood TA-RL recipe
# (config_general_action_likelihood_prefix_short_n4.yaml) through global step 39.
# This continuation keeps the same SFT-reference teacher-answer likelihood
# reward and the full serialized teacher tool-call scoring span. The added
# domain-general regularizer rewards sampled prefixes that reach the configured
# action boundary stop string and penalizes length stops, so later updates do
# not learn to spend the whole rollout budget on pre-action text. The first 20
# continuation updates use clipped group-standardized rewards to preserve the
# short-run relative signal; later updates switch to group mean-only centering,
# matching the stable default GRPO reward scale. Recomputed decoupled log-probs,
# token-ratio masking, asymmetric PPO clipping, and KL-to-SFT limit drift.
experiment_name: ta-gal-stop-gs39-gclip075-mean-kl05-rmask-asym-lr2e8-s120
trial_name: trial0

seed: 7
enable_offload: false
total_train_epochs: 1
total_train_steps: 120
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo
  name_resolve:
    type: nfs
    nfs_record_root: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 1
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  check_trajectory_format: true
  setup_timeout: 1200

gconfig:
  n_samples: 4
  min_new_tokens: 1
  max_new_tokens: 512
  max_tokens: 16384
  greedy: false
  temperature: 0.65
  top_p: 0.9
  top_k: 20

eval_gconfig:
  n_samples: 1
  min_new_tokens: 1
  max_new_tokens: 512
  max_tokens: 16384
  greedy: false
  temperature: 0.65
  top_p: 0.9
  top_k: 20

actor:
  backend: "megatron:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/checkpoints/ewer/ta-general-action-likelihood-prefix-short-n4-from-sft-local-s40-r1/trial0/default/epoch0epochstep39globalstep39
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 16384
    packing_algorithm: ffd
  pad_to_maximum: true
  enable_tree_training: true
  optimizer:
    type: adam
    lr: 2e-8
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.16
  eps_clip_higher: 0.24
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.05
  kl_estimator: k3
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  megatron:
    bridge_type: mbridge
    ddp:
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_distributed_optimizer: true
    use_deterministic_algorithms: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 16
      mem: 128
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PATH: /wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-megatron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        NCCL_SOCKET_IFNAME: enp71s0
        GLOO_SOCKET_IFNAME: enp71s0
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"
        CUDA_DEVICE_MAX_CONNECTIONS: "1"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        HF_HOME: /wbl-fast/usrs/ee/teacher-answer-rl/hf_cache
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TRITON_CACHE_DIR: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRITON_CACHE_PATH: /wbl-fast/usrs/ee/teacher-answer-rl/triton
        TRANSFORMERS_NO_TF: "1"
        USE_TF: "0"
        USE_FLAX: "0"
        TF_CPP_MIN_LOG_LEVEL: "3"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/checkpoints/ewer/qwen3-4b-thinking-terminus-tool-sft-medium-even-trajectory32768-b32-tok576k-h200/trial0/default/epoch0epochstep1384globalstep1384
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 16384
    packing_algorithm: ffd
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  python_executable: ${oc.env:AREAL_VLLM_PYTHON,/wbl-fast/usrs/ee/teacher-answer-rl/AReaL/.venv-rollout-vllm/bin/python}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_num_seqs: 64
  max_model_len: 20480
  gpu_memory_utilization: 0.70
  no_enable_prefix_caching: false
  uvicorn_log_level: warning

train_dataset:
  batch_size: 8
  shuffle: false
  pin_memory: true
  num_workers: 8
  path: /wbl-fast/usrs/ee/teacher-answer-rl/areal_runs/terminal-agent-demo/data/skill_based_easy.terminus_tool.jsonl
  split: train
  type: rl
  max_length: 15872
  scheduling_spec: null
  dataset_kwargs:
    split_part: null
    holdout_size: 0
    shuffle_records: false
    shuffle_source_groups: true
    enable_thinking: true
    lazy_tokenize: true
    workflow_mode: generic_likelihood_prefix
    generic_stop_strings:
      - "<tool_call>"
    generic_stop_reward_weight: 0.20
    generic_length_stop_penalty_weight: 0.45
    generic_prefix_length_penalty_weight: 0.08
    teacher_answer_start: tool_call
    teacher_answer_scorer: ref
    teacher_answer_score_mode: all
    teacher_answer_logp_reward_weight: 1.0
    teacher_answer_length_penalty: 0.16
    teacher_answer_reward_norm: group_then_mean_only
    teacher_answer_reward_norm_switch_step: 20
    teacher_answer_reward_norm_group_size: ${gconfig.n_samples}
    teacher_answer_reward_norm_clip: 0.75

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 40
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
